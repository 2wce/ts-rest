name: Pre-Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - rc

jobs:
  build:
    # Releases remain paused during the fork groundwork.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version a snapshot from pending changesets
        run: pnpm version-packages --snapshot ${{ inputs.tag }}
      - run: pnpm build
      - name: Publish the snapshot under its prerelease tag
        run: pnpm exec changeset publish --tag ${{ inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
