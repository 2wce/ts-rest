name: Build Test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  main:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vp-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-vp-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test:packages
      - run: pnpm build:examples
      - run: pnpm test:hosts

  e2e:
    name: Compatibility Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: make e2e
