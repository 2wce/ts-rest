packages:
  - 'apps/**/*'
  - 'libs/**/*'
  - '!apps/docs'

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  itty-router: 5.0.18
  # yauzl 2 exits during ZIP extraction on Node 26; 3 preserves the async reads.
  'extract-zip>yauzl': 3.4.0
  '@anatine/zod-openapi@^1.12.0': 1.12.0

# Vue's prop resolver imports the classic compiler API but omits its peer.
# Declare it so the Vue demo's local compiler is selected automatically.
packageExtensions:
  '@vue/compiler-sfc@3':
    peerDependencies:
      typescript: '*'
    peerDependenciesMeta:
      typescript:
        optional: true

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  azure-functions-core-tools: true
  esbuild: true
  '@nestjs/core': true
  '@swc/core': true
  sharp: true
  vue-demi: true
  workerd: true
  '@scarf/scarf': false

